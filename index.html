<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#22252f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chamada">
  <title>Chamada</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="estilo.css?v=18">
  <!-- O tema antes do primeiro desenho, para não piscar o G2 em quem escolheu outro. -->
  <script>try { const t = JSON.parse(localStorage.getItem("chamada:tema")); if (t) document.documentElement.dataset.tema = t; } catch {}</script>
</head>
<body>
  <!-- Primeira vez: o código que a Planilha Google mostra no menu Mestrão. -->
  <section id="tela-conectar" class="tela">
    <div class="banda">
      <div class="topo">
        <small>Mestrão</small>
        <h1>Chamada</h1>
      </div>
    </div>
    <div class="corpo-tela">
      <h2 class="titulo-secao">Conectar à planilha</h2>
      <div class="cartao conectar">
        <p>Na Planilha Google, menu <b>Mestrão → Código de conexão</b>. Copie no Mac e cole aqui.</p>
        <textarea id="campo-codigo" rows="4" placeholder="https://script.google.com/…/exec#…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
        <button id="btn-colar" class="btn sec" type="button">Colar</button>
        <button id="btn-conectar" class="btn pri" type="button">Conectar</button>
        <p id="erro-conectar" class="erro" hidden></p>
      </div>
    </div>
  </section>

  <section id="tela-hoje" class="tela">
    <div class="banda">
      <div class="topo">
        <div class="topo-linha">
          <small id="hoje-data"></small>
          <button id="btn-ajustes" class="icone" aria-label="Ajustes">⚙︎</button>
        </div>
        <h1>Hoje</h1>
        <button id="chip" class="chip" type="button"><b></b><span>Conectando à planilha…</span></button>
      </div>
    </div>
    <div id="hoje-conteudo" class="corpo-tela"></div>
  </section>

  <section id="tela-turmas" class="tela">
    <div class="banda">
      <div class="topo">
        <small id="turmas-periodo"></small>
        <h1>Turmas</h1>
      </div>
    </div>
    <div id="turmas-conteudo" class="corpo-tela"></div>
  </section>

  <section id="tela-turma" class="tela">
    <div class="banda">
      <div class="cab">
        <button class="voltar" data-voltar aria-label="Voltar">‹</button>
        <div><small id="turma-resumo"></small><strong id="turma-nome"></strong></div>
      </div>
    </div>
    <div id="turma-aulas" class="corpo-tela"></div>
  </section>

  <section id="tela-chamada" class="tela">
    <div class="banda">
      <div class="cab">
        <button class="voltar" data-voltar aria-label="Voltar">‹</button>
        <div><small id="chamada-quando"></small><strong id="chamada-turma"></strong></div>
      </div>
      <div class="contas">
        <span class="p"><b id="conta-presentes">0</b>presentes</span>
        <span class="f"><b id="conta-faltas">0</b>faltas</span>
        <span class="j"><b id="conta-justificadas">0</b>justificadas</span>
      </div>
    </div>
    <p id="chamada-aviso" class="aviso" hidden></p>
    <div id="chamada-alunos" class="lista alunos"></div>
    <div class="espaco-do-botao"></div>
    <button id="btn-enviar" class="flutua" type="button">Enviar chamada</button>
  </section>

  <!-- Justificativa: os códigos da Mestre 1.0.57 (CONTRATOS.md §1). -->
  <dialog id="folha-motivo" class="folha">
    <form method="dialog">
      <div class="pega"></div>
      <small>Justificativa</small>
      <h3 id="motivo-aluno"></h3>
      <div id="motivos" class="motivos"></div>
    </form>
  </dialog>

  <!-- O que aconteceu com o envio: enviada, guardada no celular ou recusada. -->
  <dialog id="folha-envio" class="folha">
    <form method="dialog">
      <div class="pega"></div>
      <div id="envio-conteudo"></div>
    </form>
  </dialog>

  <dialog id="folha-ajustes" class="folha">
    <form method="dialog">
      <div class="pega"></div>
      <h3>Ajustes</h3>
      <p class="rotulo">Tema</p>
      <label class="opcao"><input type="radio" name="tema" value="g2"> Gibi papel jornal (padrão)</label>
      <label class="opcao"><input type="radio" name="tema" value="g1"> Gibi clássico</label>
      <label class="opcao"><input type="radio" name="tema" value="g3"> Gibi faixa nanquim</label>
      <p class="rotulo">Horários do mesmo dia</p>
      <label class="opcao"><input type="radio" name="modo" value="juntos"> Uma chamada, gravada em todos os horários</label>
      <label class="opcao"><input type="radio" name="modo" value="separados"> Uma chamada para cada horário</label>
      <button id="btn-atualizar" class="btn sec" type="button">Buscar a planilha agora</button>
      <button id="btn-trocar-codigo" class="btn sec" type="button">Trocar o código de conexão</button>
      <button class="btn pri" value="fechar">Fechar</button>
      <p class="versao">Chamada 18</p>
    </form>
  </dialog>

  <!-- Hoje e Turmas, como na v15: o dia na frente, o período inteiro ao lado. -->
  <nav id="abas" class="abas" hidden>
    <button type="button" data-aba="hoje"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Hoje</button>
    <button type="button" data-aba="turmas"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Turmas</button>
  </nav>

  <div id="aviso-rapido" role="status"></div>
  <script src="app.js?v=18"></script>
</body>
</html>
